name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Stamp release version
        shell: bash
        run: |
          VERSION="${GITHUB_SHA:0:7}"
          printf '{"version":"%s","updatedAt":"%s"}\n' "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          sed -i "s/__APP_VERSION__/${VERSION}/g" index.html
          sed -i "s#style.css#style.css?v=${VERSION}#g; s#script.js#script.js?v=${VERSION}#g; s#assets/logo.png?v=__APP_VERSION__#assets/logo.png?v=${VERSION}#g" index.html
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
